<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dentes da engrenagem -->
  <g fill="#C9953C" stroke="#5A3E2B" stroke-width="2" stroke-linejoin="round">
    <rect x="28" y="6" width="8" height="8" rx="1.5"/>
    <rect x="28" y="50" width="8" height="8" rx="1.5"/>
    <rect x="6" y="28" width="8" height="8" rx="1.5"/>
    <rect x="50" y="28" width="8" height="8" rx="1.5"/>
    <rect x="12" y="12" width="8" height="8" rx="1.5" transform="rotate(45 16 16)"/>
    <rect x="44" y="44" width="8" height="8" rx="1.5" transform="rotate(45 48 48)"/>
    <rect x="44" y="12" width="8" height="8" rx="1.5" transform="rotate(45 48 16)"/>
    <rect x="12" y="44" width="8" height="8" rx="1.5" transform="rotate(45 16 48)"/>
    <!-- Corpo circular principal -->
    <circle cx="32" cy="32" r="18" fill="#C9953C"/>
  </g>
  <!-- Destaque interno de metal e orifício -->
  <circle cx="32" cy="32" r="12" fill="#E8B94A" stroke="#5A3E2B" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="5" fill="#5A3E2B"/>
  <circle cx="30" cy="30" r="1.5" fill="#F3E6C4"/>
</svg>
