<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cabo de madeira inclinado -->
  <line x1="20" y1="52" x2="42" y2="22" stroke="#5A3E2B" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="52" x2="42" y2="22" stroke="#C9953C" stroke-width="2" stroke-linecap="round"/>
  <!-- Cabeça do martelo em pedra com musgo -->
  <rect x="30" y="10" width="22" height="15" rx="4" transform="rotate(-35 41 17.5)" 
        fill="#8FB05A" stroke="#5A3E2B" stroke-width="2.5"/>
  <!-- Faixas de fixação em couro -->
  <line x1="38" y1="19" x2="44" y2="27" stroke="#E8B94A" stroke-width="2.5"/>
  <line x1="44" y1="21" x2="38" y2="29" stroke="#E8B94A" stroke-width="2.5"/>
  <!-- Faíscas douradas de conserto -->
  <polygon points="52,8 54,12 58,14 54,16 52,20 50,16 46,14 50,12" fill="#E8B94A"/>
  <polygon points="26,18 27,20 29,21 27,22 26,24 25,22 23,21 25,20" fill="#F3E6C4"/>
</svg>
