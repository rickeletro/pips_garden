<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tripé de gravetos inclinados -->
  <line x1="14" y1="56" x2="30" y2="20" stroke="#5A3E2B" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="56" x2="34" y2="20" stroke="#5A3E2B" stroke-width="4" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="32" y2="18" stroke="#4F6B3A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Amarração de barbante -->
  <rect x="28" y="20" width="8" height="6" rx="2" fill="#E8B94A" stroke="#5A3E2B" stroke-width="1.5"/>
  <!-- Engrenagem de latão no topo -->
  <circle cx="32" cy="14" r="8" fill="#C9953C" stroke="#5A3E2B" stroke-width="2"/>
  <circle cx="32" cy="14" r="3" fill="#F3E6C4"/>
  <!-- Dentes da engrenagem -->
  <rect x="30" y="4" width="4" height="3" fill="#C9953C"/>
  <rect x="30" y="21" width="4" height="3" fill="#C9953C"/>
  <rect x="22" y="12" width="3" height="4" fill="#C9953C"/>
  <rect x="39" y="12" width="3" height="4" fill="#C9953C"/>
  <!-- Frasco de bolota com veneno -->
  <ellipse cx="32" cy="34" rx="6" ry="7" fill="#7ED957" stroke="#5A3E2B" stroke-width="2"/>
  <ellipse cx="32" cy="31" rx="5" ry="3" fill="#E8B94A" opacity="0.8"/>
</svg>
